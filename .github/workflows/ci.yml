name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  calidad:
    name: Lint · Tipos · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Generar cliente Prisma
        run: bunx prisma generate

      - name: Validar diagramas Mermaid (render de GitHub)
        run: bun scripts/check-mermaid.mjs

      - name: Lint
        run: bun run lint

      - name: Comprobación de tipos
        run: bun run typecheck

      - name: Tests unitarios con cobertura
        run: bun run test:coverage

      - name: Subir cobertura a Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage/coverage-final.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build de producción (standalone)
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Base de datos (creación del esquema)
        run: bunx prisma db push --accept-data-loss
        env:
          DATABASE_URL: "file:./db/ci.db"

      - name: Compilar
        run: bun run build
        env:
          DATABASE_URL: "file:./db/ci.db"
