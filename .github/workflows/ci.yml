name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  calidad:
    name: Lint · Tipos · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Generar cliente Prisma
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Comprobación de tipos
        run: bun run typecheck

      - name: Tests unitarios (ELO, catálogo)
        run: bun run test

  build:
    name: Build de producción (standalone)
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Base de datos (creación del esquema)
        run: bunx prisma db push --accept-data-loss
        env:
          DATABASE_URL: "file:./db/ci.db"

      - name: Compilar
        run: bun run build
        env:
          DATABASE_URL: "file:./db/ci.db"
