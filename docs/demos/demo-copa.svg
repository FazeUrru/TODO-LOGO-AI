<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-label="Animación de la Copa Todólogo: bracket de 4 modelos, semifinales, final y campeón">
  <style>
    /* Línea temporal maestra: 10 s en bucle */
    .semi { opacity:0; animation: semiIn 10s ease infinite; }
    @keyframes semiIn { 0%,3% { opacity:0; transform: translateY(10px) } 9%,88% { opacity:1; transform:none } 96%,100% { opacity:0 } }
    .tdot { animation: tblink 10s infinite; }
    @keyframes tblink { 0%,9% { opacity:0 } 11%,17% { opacity:.9 } 13% { opacity:.3 } 15% { opacity:.9 } 18%,88% { opacity:0 } 100% { opacity:0 } }
    .textline { opacity:0; animation: lineIn 10s ease infinite; }
    @keyframes lineIn { 0%,12% { opacity:0 } 20%,88% { opacity:1 } 96%,100% { opacity:0 } }
    .loser { animation: dimLoser 10s ease infinite; }
    @keyframes dimLoser { 0%,29% { opacity:1 } 34%,88% { opacity:.32 } 96%,100% { opacity:0 } }
    .winring { opacity:0; animation: winRing 10s ease infinite; }
    @keyframes winRing { 0%,32% { opacity:0 } 36%,88% { opacity:1 } 96%,100% { opacity:0 } }
    .winchip { opacity:0; animation: chipIn 10s cubic-bezier(.2,.9,.3,1.3) infinite; }
    @keyframes chipIn { 0%,34% { opacity:0; transform: scale(.6) } 39%,88% { opacity:1; transform:scale(1) } 96%,100% { opacity:0 } }
    .finalBox { opacity:0; animation: finalIn 10s ease infinite; }
    @keyframes finalIn { 0%,40% { opacity:0; transform: translateY(10px) } 47%,88% { opacity:1; transform:none } 96%,100% { opacity:0 } }
    .ftext { opacity:0; animation: lineIn 10s ease infinite; }
    .flow { stroke-dasharray: 46; stroke-dashoffset: 46; animation: draw 10s ease infinite; }
    @keyframes draw { 0%,36% { stroke-dashoffset:46 } 44%,88% { stroke-dashoffset:0 } 96%,100% { stroke-dashoffset:46 } }
    .champ { opacity:0; transform-origin: 450px 96px; animation: champIn 10s cubic-bezier(.2,.9,.3,1.4) infinite; }
    @keyframes champIn { 0%,56% { opacity:0; transform: scale(.5) } 62%,88% { opacity:1; transform:scale(1) } 96%,100% { opacity:0 } }
    .conf { opacity:0; animation: confFall 10s linear infinite; }
    @keyframes confFall { 0%,60% { opacity:0; transform: translateY(-8px) } 63% { opacity:1 } 92%,100% { opacity:0; transform: translateY(120px) rotate(160deg) } }
    .lbl { font-family: 'Cascadia Code', Consolas, monospace; }
  </style>

  <rect width="900" height="640" rx="18" fill="#FCFAF8"/>
  <rect x="0.5" y="0.5" width="899" height="639" rx="18" fill="none" stroke="#EEEDEC"/>

  <!-- Cabecera -->
  <text x="36" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="600" fill="#2E2B29">Copa <tspan font-style="italic">Todólogo</tspan></text>
  <rect x="318" y="30" width="66" height="22" rx="6" fill="#F4C406"/>
  <text x="351" y="46" text-anchor="middle" class="lbl" font-size="11" font-weight="700" fill="#2E2B29">NUEVO</text>
  <text x="36" y="80" font-family="system-ui, 'Segoe UI', sans-serif" font-size="15" fill="#6B6660">Consigna: «Explica por qué el cielo es azul, con una analogía memorable»</text>

  <!-- Confeti (tras el campeón) -->
  <g>
    <rect class="conf" x="360" y="52" width="8" height="12" rx="2" fill="#F4C406" style="animation-delay:0s"/>
    <rect class="conf" x="420" y="52" width="7" height="11" rx="2" fill="#B45309" style="animation-delay:.35s"/>
    <rect class="conf" x="484" y="52" width="8" height="10" rx="2" fill="#15803D" style="animation-delay:.7s"/>
    <rect class="conf" x="544" y="52" width="6" height="12" rx="2" fill="#7C3AED" style="animation-delay:.15s"/>
    <rect class="conf" x="392" y="52" width="7" height="9" rx="2" fill="#DC2626" style="animation-delay:.55s"/>
    <rect class="conf" x="512" y="52" width="8" height="11" rx="2" fill="#2E2B29" style="animation-delay:.9s"/>
  </g>

  <!-- Campeón -->
  <g class="champ">
    <circle cx="450" cy="96" r="40" fill="#F4C406"/>
    <path d="M432 86 h36 v10 a18 14 0 0 1 -36 0 z" fill="#2E2B29"/>
    <rect x="446" y="108" width="8" height="8" fill="#2E2B29"/>
    <rect x="438" y="116" width="24" height="6" rx="2" fill="#2E2B29"/>
    <path d="M432 88 l-8 -2 3 12 a7 7 0 0 0 6 4 z" fill="#2E2B29" transform="translate(-2,0)"/>
    <path d="M468 88 l8 -2 -3 12 a7 7 0 0 1 -6 4 z" fill="#2E2B29" transform="translate(2,0)"/>
    <text x="450" y="158" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="600" fill="#2E2B29">Campeón: revelación final</text>
    <text x="450" y="180" text-anchor="middle" class="lbl" font-size="13" fill="#6B6660">ELO real · 3 duelos ganados · +ELO al ranking</text>
  </g>

  <!-- Conectores hacia el campeón -->
  <path class="flow" d="M228 516 v26 h444 v-26" fill="none" stroke="#C9C4BD" stroke-width="2"/>
  <path class="flow" d="M450 300 v64" fill="none" stroke="#C9C4BD" stroke-width="2" style="animation-delay:.4s"/>

  <!-- Semifinal 1 -->
  <g class="semi">
    <text x="36" y="228" class="lbl" font-size="12" fill="#6B6660">SEMIFINAL 1</text>
  </g>
  <g class="semi">
    <rect x="36" y="238" width="192" height="120" rx="12" fill="#FFFFFF" stroke="#EEEDEC"/>
    <circle cx="58" cy="262" r="10" fill="#F2EEE9"/><text x="58" y="266" text-anchor="middle" class="lbl" font-size="10" fill="#2E2B29">A1</text>
    <text x="76" y="266" class="lbl" font-size="12" fill="#2E2B29">Contendiente A1</text>
    <circle class="tdot" cx="52" cy="292" r="3" fill="#2E2B29"/><circle class="tdot" cx="64" cy="292" r="3" fill="#2E2B29"/><circle class="tdot" cx="76" cy="292" r="3" fill="#2E2B29"/>
    <rect class="textline" x="52" y="288" width="158" height="8" rx="4" fill="#F2EEE9" style="animation-delay:.5s"/>
    <rect class="textline" x="52" y="304" width="150" height="8" rx="4" fill="#F2EEE9" style="animation-delay:.8s"/>
    <rect class="textline" x="52" y="320" width="160" height="8" rx="4" fill="#F2EEE9" style="animation-delay:1.1s"/>
    <rect class="textline" x="52" y="336" width="120" height="8" rx="4" fill="#F2EEE9" style="animation-delay:1.4s"/>
  </g>
  <g class="semi">
    <rect x="36" y="370" width="192" height="120" rx="12" fill="#FFFFFF" stroke="#EEEDEC"/>
    <circle cx="58" cy="394" r="10" fill="#F2EEE9"/><text x="58" y="398" text-anchor="middle" class="lbl" font-size="10" fill="#2E2B29">A2</text>
    <text x="76" y="398" class="lbl" font-size="12" fill="#2E2B29">Contendiente A2</text>
    <circle class="tdot" cx="52" cy="424" r="3" fill="#2E2B29"/><circle class="tdot" cx="64" cy="424" r="3" fill="#2E2B29"/><circle class="tdot" cx="76" cy="424" r="3" fill="#2E2B29"/>
    <rect class="textline" x="52" y="420" width="158" height="8" rx="4" fill="#F2EEE9" style="animation-delay:.7s"/>
    <rect class="textline" x="52" y="436" width="140" height="8" rx="4" fill="#F2EEE9" style="animation-delay:1s"/>
    <rect class="textline" x="52" y="452" width="156" height="8" rx="4" fill="#F2EEE9" style="animation-delay:1.3s"/>
    <rect class="textline" x="52" y="468" width="104" height="8" rx="4" fill="#F2EEE9" style="animation-delay:1.6s"/>
  </g>

  <!-- Semifinal 2 -->
  <g class="semi">
    <rect x="672" y="238" width="192" height="120" rx="12" fill="#FFFFFF" stroke="#EEEDEC"/>
    <circle cx="694" cy="262" r="10" fill="#F2EEE9"/><text x="694" y="266" text-anchor="middle" class="lbl" font-size="10" fill="#2E2B29">B1</text>
    <text x="712" y="266" class="lbl" font-size="12" fill="#2E2B29">Contendiente B1</text>
    <circle class="tdot" cx="688" cy="292" r="3" fill="#2E2B29"/><circle class="tdot" cx="700" cy="292" r="3" fill="#2E2B29"/><circle class="tdot" cx="712" cy="292" r="3" fill="#2E2B29"/>
    <rect class="textline" x="688" y="288" width="158" height="8" rx="4" fill="#F2EEE9" style="animation-delay:.6s"/>
    <rect class="textline" x="688" y="304" width="146" height="8" rx="4" fill="#F2EEE9" style="animation-delay:.9s"/>
    <rect class="textline" x="688" y="320" width="158" height="8" rx="4" fill="#F2EEE9" style="animation-delay:1.2s"/>
    <rect class="textline" x="688" y="336" width="118" height="8" rx="4" fill="#F2EEE9" style="animation-delay:1.5s"/>
  </g>
  <g class="semi">
    <rect x="672" y="370" width="192" height="120" rx="12" fill="#FFFFFF" stroke="#EEEDEC"/>
    <circle cx="694" cy="394" r="10" fill="#F2EEE9"/><text x="694" y="398" text-anchor="middle" class="lbl" font-size="10" fill="#2E2B29">B2</text>
    <text x="712" y="398" class="lbl" font-size="12" fill="#2E2B29">Contendiente B2</text>
    <circle class="tdot" cx="688" cy="424" r="3" fill="#2E2B29"/><circle class="tdot" cx="700" cy="424" r="3" fill="#2E2B29"/><circle class="tdot" cx="712" cy="424" r="3" fill="#2E2B29"/>
    <rect class="textline" x="688" y="420" width="152" height="8" rx="4" fill="#F2EEE9" style="animation-delay:.8s"/>
    <rect class="textline" x="688" y="436" width="136" height="8" rx="4" fill="#F2EEE9" style="animation-delay:1.1s"/>
    <rect class="textline" x="688" y="452" width="154" height="8" rx="4" fill="#F2EEE9" style="animation-delay:1.4s"/>
    <rect class="textline" x="688" y="468" width="96" height="8" rx="4" fill="#F2EEE9" style="animation-delay:1.7s"/>
  </g>

  <!-- Perdedores atenuados (A2 y B1 pierden) -->
  <rect class="loser" x="36" y="370" width="192" height="120" rx="12" fill="#FCFAF8" opacity="0"/>
  <rect class="loser" x="672" y="238" width="192" height="120" rx="12" fill="#FCFAF8" opacity="0"/>
  <text class="loser lbl" x="132" y="436" text-anchor="middle" font-size="12" fill="#6B6660">eliminado</text>
  <text class="loser lbl" x="768" y="304" text-anchor="middle" font-size="12" fill="#6B6660">eliminado</text>

  <!-- Anillos de ganador -->
  <rect class="winring" x="34" y="236" width="196" height="124" rx="13" fill="none" stroke="#2E2B29" stroke-width="2.5"/>
  <rect class="winring" x="670" y="368" width="196" height="124" rx="13" fill="none" stroke="#2E2B29" stroke-width="2.5"/>
  <g class="winchip">
    <rect x="112" y="228" width="120" height="20" rx="10" fill="#F4C406"/>
    <text x="172" y="242" text-anchor="middle" class="lbl" font-size="11" font-weight="700" fill="#2E2B29">PASA +12 ELO</text>
  </g>
  <g class="winchip">
    <rect x="748" y="360" width="120" height="20" rx="10" fill="#F4C406"/>
    <text x="808" y="374" text-anchor="middle" class="lbl" font-size="11" font-weight="700" fill="#2E2B29">PASA +8 ELO</text>
  </g>

  <!-- Final -->
  <g class="finalBox">
    <text x="368" y="392" class="lbl" font-size="12" fill="#6B6660">GRAN FINAL</text>
  </g>
  <g class="finalBox">
    <rect x="354" y="402" width="192" height="104" rx="12" fill="#FFFFFF" stroke="#EEEDEC"/>
    <circle cx="376" cy="426" r="10" fill="#F2EEE9"/><text x="376" y="430" text-anchor="middle" class="lbl" font-size="10" fill="#2E2B29">F1</text>
    <text x="394" y="430" class="lbl" font-size="12" fill="#2E2B29">Ganador SF1</text>
    <rect class="ftext" x="370" y="448" width="158" height="8" rx="4" fill="#F2EEE9"/>
    <rect class="ftext" x="370" y="464" width="146" height="8" rx="4" fill="#F2EEE9"/>
    <rect class="ftext" x="370" y="480" width="132" height="8" rx="4" fill="#F2EEE9"/>
  </g>
  <g class="finalBox">
    <rect x="354" y="518" width="192" height="104" rx="12" fill="#FFFFFF" stroke="#EEEDEC"/>
    <circle cx="376" cy="542" r="10" fill="#F2EEE9"/><text x="376" y="546" text-anchor="middle" class="lbl" font-size="10" fill="#2E2B29">F2</text>
    <text x="394" y="546" class="lbl" font-size="12" fill="#2E2B29">Ganador SF2</text>
    <rect class="ftext" x="370" y="564" width="154" height="8" rx="4" fill="#F2EEE9"/>
    <rect class="ftext" x="370" y="580" width="142" height="8" rx="4" fill="#F2EEE9"/>
    <rect class="ftext" x="370" y="596" width="118" height="8" rx="4" fill="#F2EEE9"/>
  </g>

  <!-- Botones de voto -->
  <g class="finalBox">
    <rect x="590" y="430" width="130" height="34" rx="9" fill="#FFFFFF" stroke="#EEEDEC"/>
    <text x="655" y="452" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12.5" fill="#2E2B29">Gana F1</text>
    <rect x="590" y="474" width="130" height="34" rx="9" fill="#FFFFFF" stroke="#EEEDEC"/>
    <text x="655" y="496" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12.5" fill="#2E2B29">Gana F2</text>
  </g>

  <text x="36" y="622" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" fill="#6B6660">Semifinales en paralelo → tú votas a los ganadores → la final se genera al vuelo → revelación con confeti.</text>
</svg>
