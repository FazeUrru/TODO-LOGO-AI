# todólogo.ai — orquestación de desarrollo/producción con backend real
# Uso:
#   docker compose up --build          → app en http://localhost:3000
#   docker compose logs -f todologo    → logs estructurados JSON
#
# El volumen ./db persiste el ELO global, votos y cuentas entre reinicios.
# OAuth nativo (opcional): descomenta y rellena las variables de entorno.

services:
  todologo:
    build: .
    container_name: todologo-ai
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/db/custom.db
      # AUTH_SECRET: cámbialo por un secreto largo y aleatorio en producción
      # AUTH_SECRET: "cambia-esto-por-un-secreto-largo"
      # ── OAuth 2.0 nativo (opcional) ──
      # GOOGLE_CLIENT_ID: ""
      # GOOGLE_CLIENT_SECRET: ""
      # GITHUB_CLIENT_ID: ""
      # GITHUB_CLIENT_SECRET: ""
      # ── SDK de IA (si tu despliegue lo requiere) ──
      # ZAI_API_KEY: ""
    volumes:
      - ./db:/app/db
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s
